project:
  name: nrl-procurement-synthetic-data

# Environment variables in .env override these defaults.
curator:
  local_only: true
  viewer_enabled: false
  telemetry_enabled: false
  cache_dir: .curator_working

# A full, unbounded generation requires a successful nested structured-output
# probe for the exact generation and judge deployment/mode fingerprints.
# Bounded --limit pilots remain available to diagnose a newly configured role.
structured_output_probe:
  required_for_full_runs: true

# Optional multi-pass generation. ``max_passes: 0`` removes the numeric cap;
# every parent must then independently produce ``empty_passes_required``
# consecutive successful, schema-valid passes with no accepted novelty.
# Failures are quarantined as incomplete and never count as saturation.
saturation:
  enabled: true
  max_passes: 0
  empty_passes_required: 2

paths:
  source_dir: data/source
  ocr_dir: data/interim/ocr
  output_root: outputs
  drafting_seeds: data/seeds/drafting_requests.jsonl

model_profiles:
  glm:
    served_model_env: GLM_MODEL
    base_url_env: GLM_BASE_URL
    api_key_env: GLM_API_KEY
    deployment_identity_env: GLM_DEPLOYMENT_ID
    structured_output_mode: json_schema
    # Cross-document pass 5 still produced valid long-running requests at the
    # former 600s boundary after concurrency was reduced to 32. Allow twenty
    # minutes per attempt while retaining one retry; this remains below the old
    # 1800s-per-attempt setting and its roughly one-hour two-attempt tail.
    request_timeout: 1200
    max_retries: 1
    # Cross-document generation at 128 concurrent requests degraded into a
    # synchronized 180/225 timeout wave. Use 45 for the shared-gateway smoke,
    # above the previously stable 32 but still far below the failed 128; retain
    # the measured timeout/yield evidence before increasing it again.
    max_concurrent_requests: 45
    # The private server omits max_model_len from /models and does not expose
    # /tokenize. Keep a conservative explicit prompt-budget fallback.
    context_window: 32768
    generation_params:
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
  nemotron:
    served_model_env: NEMOTRON_MODEL
    base_url_env: NEMOTRON_BASE_URL
    api_key_env: NEMOTRON_API_KEY
    deployment_identity_env: NEMOTRON_DEPLOYMENT_ID
    # This deployment accepts schema-valid auto tool calls but returns HTTP 500
    # for named/required forcing. Curator still requires and validates exactly
    # one call to the Pydantic-derived tool.
    structured_output_mode: tools_auto
    # qwen3_coder in vLLM 0.25 misclassifies nested $ref fields as strings.
    # Inline non-recursive references only for this affected deployment.
    dereference_tool_schema: true
    # Operational limit of the private deployment; independently configurable
    # from the model's advertised maximum and source-window construction size.
    context_window: 131072
    generation_params:
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
  gemma_thinking:
    served_model_env: MODEL
    base_url_env: LLM_BASE_URL
    api_key_env: LLM_API_KEY
    deployment_identity_env: LLM_DEPLOYMENT_ID
    structured_output_mode: json_schema
    # Conservative deployment fallback. The structured-output probe also reads
    # the exact server limit from vLLM's /tokenize response when available.
    context_window: 32768
    # Shared-gateway smoke concurrency; monitor scheduler latency and timeout
    # yield before increasing it beyond this user-selected value.
    max_concurrent_requests: 45
    generation_params:
      temperature: 1.0
      top_p: 0.95
      top_k: 64
      extra_body:
        chat_template_kwargs:
          enable_thinking: true
  gemma_structured:
    # Fast schema-constrained judge on the same shared-gateway Gemma route.
    # Keep provider reasoning disabled: these stages request an auditable
    # decision object, and hidden reasoning was consuming the entire ordinary
    # completion budget before that object was complete.
    served_model_env: MODEL
    base_url_env: LLM_BASE_URL
    api_key_env: LLM_API_KEY
    deployment_identity_env: LLM_DEPLOYMENT_ID
    structured_output_mode: json_schema
    context_window: 32768
    max_concurrent_requests: 45
    generation_params:
      temperature: 1.0
      top_p: 0.95
      top_k: 64
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
  gemma:
    served_model_env: GEMMA_MODEL
    base_url_env: GEMMA_BASE_URL
    api_key_env: GEMMA_API_KEY
    deployment_identity_env: GEMMA_DEPLOYMENT_ID
    structured_output_mode: json_schema
    # Verified from this private vLLM endpoint's /models metadata.
    context_window: 131072
    # Gemma 4 official generation defaults and non-thinking chat-template mode.
    generation_params:
      temperature: 1.0
      top_p: 0.95
      top_k: 64
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
  ministral:
    served_model_env: MINISTRAL_MODEL
    base_url_env: MINISTRAL_BASE_URL
    api_key_env: MINISTRAL_API_KEY
    deployment_identity_env: MINISTRAL_DEPLOYMENT_ID
    # Exact support remains gated by the deployment probe below; the official
    # Instruct model advertises native JSON output and recommends vLLM >=0.12.
    structured_output_mode: json_schema
    # Verified from this private vLLM endpoint's /models metadata.
    context_window: 65536
    max_concurrent_requests: 16
    generation_params:
      # Mistral recommends temperature below 0.1 for production use.
      temperature: 0.05
  qwen:
    served_model_env: QWEN_MODEL
    base_url_env: QWEN_BASE_URL
    api_key_env: QWEN_API_KEY
    deployment_identity_env: QWEN_DEPLOYMENT_ID
    # Conservative fallback until this exact endpoint passes its probe.
    structured_output_mode: md_json
    generation_params:
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

models:
  generation:
    mode: hosted_vllm
    profile_env: GENERATION_PROFILE
    default_profile: glm
    private_endpoint_only: true
    request_timeout: 1800
    # Two retries for transient/schema failures; ten identical structured-output
    # retries created pilot-003's long tail.
    # Initial attempt plus two bounded validation-aware corrections. Instructor
    # returns validation context to the model; permanent failures remain audited.
    max_retries: 2
    max_concurrent_requests: 128
    # Explicit private-provider limits avoid Curator's public-provider fallback.
    max_requests_per_minute: 10000
    max_tokens_per_minute: 100000000
    # Terminal omissions (including max_tokens truncation) are retried once in
    # a separate checkpoint at this larger ceiling. Ordinary requests retain
    # the smaller scheduling reserve below.
    output_rescue_max_tokens: 12000
    output_rescue_max_concurrent_requests: 45
    generation_params:
      temperature: 1.0
      top_p: 0.95
      # The native GLM pipeline's stable structured-output setting is 5,000.
      # This avoids advertising an 8,192-token tail to the shared scheduler for
      # every request; the separately checkpointed 12,000-token rescue still
      # handles the rare verbose path-answer or cross-document truncation.
      max_tokens: 5000

  # Select an independent local judge through JUDGE_PROFILE/.env.
  judge:
    mode: hosted_vllm
    profile_env: JUDGE_PROFILE
    default_profile: gemma_structured
    private_endpoint_only: true
    request_timeout: 1800
    max_retries: 1
    max_concurrent_requests: 64
    # Keep judge throttling independent when it uses a separate local endpoint.
    max_requests_per_minute: 10000
    max_tokens_per_minute: 100000000
    # The 500-record saturation pilot proved that 2,048 truncates a small
    # fraction of otherwise valid singular cross-document judgments. Retry only
    # those missing decisions once at 4,096 after a context-window preflight.
    output_rescue_max_tokens: 4096
    output_rescue_max_concurrent_requests: 45
    generation_params:
      temperature: 1.0
      top_p: 0.95
      # Singular judge objects are normally far smaller; 2,048 prevents the
      # observed 1,024-token truncation tail while retaining prompt capacity.
      max_tokens: 2048

  ocr:
    engine: chandra
    model_env: OCR_MODEL
    model_revision_env: OCR_MODEL_REVISION
    package_revision_env: OCR_PACKAGE_REVISION
    base_url_env: OCR_BASE_URL
    api_key_env: OCR_API_KEY
    private_endpoint_only: true
    command_env: OCR_COMMAND
    output_dir_env: OCR_OUTPUT_DIR

source_registry:
  require_complete_ocr_provenance_for_full_runs: true

quality:
  # CoT candidates have a lower validation/judge survival rate than direct QA.
  # Plan 40% so the accepted pool can meet the separate 20% release floor.
  qa_cot_fraction: 0.40
  cross_qa_cot_fraction: 0.25
  # Direct facts remain one-shot. Only source-feasible multi-operation cells
  # receive independent alternatives, which are deterministically validated,
  # independently judged, and reduced to one grounded winner.
  single_document_best_of_n:
    basic: 1
    intermediate: 2
    advanced: 3
  # One bounded corrected replacement per blueprint when every generated
  # sibling fails deterministic grounding/format validation. Strict validators
  # remain unchanged; the failed original stays in the audit trail.
  generation_validation_rescue: true
  # Constructed only from accepted answerable seeds plus same-type distractors,
  # then promoted by an independent full-context answerability judge.
  unanswerable_fraction: 0.10
  minimum_judge_score: 4
  # The configured Gemma judge server has an 8,192-token runtime context.
  judge_batch_size: 1
  dedupe_threshold: 94
  # Plan feasible semantic intents before generation. The generator must honor
  # the assigned type; weights are portfolio targets, not permission to force
  # an intent that the source passage cannot support.
  question_type_weights:
    direct_fact: 0.15
    definition: 0.05
    procedure: 0.12
    sequence: 0.08
    threshold: 0.10
    exception: 0.10
    negative_rule: 0.08
    role_responsibility: 0.10
    comparison: 0.07
    compliance_check: 0.12
    currentness: 0.03
  max_question_type_share: 0.20
  minimum_effective_question_types: 6
  max_question_style_share: 0.20
  answer_length_by_format:
    concise_direct: [5, 100]
    ordered_steps: [20, 220]
    audit_check: [15, 180]
    compact_comparison: [20, 180]
    rule_and_exception: [15, 160]
    responsibility_summary: [10, 140]
    dated_scope_summary: [15, 160]
  # Corpus-level cap: no single normalized 4-word question opener may exceed
  # this share of the deterministic-pass, deduplicated pool. Grounded in
  # Self-Instruct's pool-similarity filtering (ACL 2023) generalized from
  # near-duplicate full text to shared opening templates.
  max_question_opener_share: 0.08
  # Preserve some exact-answer records, but prevent the SFT corpus from mostly
  # teaching source-span copying. Answers shorter than four words are exempt.
  max_extractive_answer_share: 0.35
  minimum_qa_cot_share: 0.20
  allow_unjudged_exports: false
  require_independent_judge: true
  required_task_types:
    - qa
    - qa_cot

# Human labels, not model self-scores, select the production judge threshold.
# Full runs remain blocked until the generated passing artifact is SHA-pinned.
judge_calibration:
  path: data/evaluation/judge_calibration.json
  sha256: null
  required_for_full_runs: true
  minimum_holdout_precision: 0.90
  minimum_records_per_split: 25

# Optional semantic-diversity analysis. Only generated questions are sent to
# this endpoint; source passages, answers, evidence, and credentials are not.
# Verified-equivalence selection is safe without a universal cosine cutoff:
# questions are removed only when their grounded target, evidence, sources, and
# coverage contract are identical. A broader cosine-threshold mode still
# requires reviewed development and holdout calibration.
#
# `verified_equivalence`'s answer-text-exact-match requirement means it will
# almost never catch two independently-generated paraphrases of the same
# fact (audit T10 / Finding S1). `hybrid_equivalence` (implemented, not yet
# the default here) closes that gap: it drops the literal-answer-text
# requirement from the structural signature and instead requires a cosine
# floor (`similarity_threshold`) on top of the same strict structural match
# before deleting anything. That floor is still an uncalibrated, defensible
# default rather than a measured operating point — no human-labeled
# duplicate/related/distinct calibration set exists yet for this deployment
# (see the still-open "hand-label a calibration set" item in TASKS.md).
# Switch `selection_mode` to `hybrid_equivalence` (with an explicit
# `similarity_threshold` floor) once that calibration work lands, or after
# deliberately reviewing a real batch of `semantic_calibration.jsonl`
# nearest-neighbor pairs and choosing a floor with evidence behind it.
embeddings:
  enabled: true
  api_key_env: EMBEDDING_API_KEY
  base_url_env: EMBEDDING_BASE_URL
  model_env: EMBEDDING_MODEL
  input_type: query
  dimensions: 1024
  truncate: NONE
  batch_size: 64
  timeout_seconds: 120
  calibration_neighbors_per_record: 5
  selection_enabled: true
  selection_mode: verified_equivalence
  similarity_threshold: null

propositions:
  # Only path_qa and temporal consume propositions; both are disabled below
  # for the current qa/qa_cot-only scope. Re-enable alongside them.
  enabled: true
  max_per_window: 8

reasoning_paths:
  # Only path_qa consumes reasoning paths; disabled below for the current
  # qa/qa_cot-only scope. Re-enable alongside path_qa.
  enabled: true
  max_per_pair: 25

# Temporal artifacts are derived from accepted, exact-evidence propositions.
# "publication_series" pairs compare dated editions but never imply legal
# supersession or present-day applicability.
temporal:
  enabled: true
  verification_cutoff: "2026-07-30"
  discover_pairs_from_manifest: true
  pilot_pairs_per_edge: 2
  holdout_rule_family_fraction: 0.2
  split_seed: nrl-temporal-v1
  pairs: []
  # This is an experiment configuration consumed by a trainer, not a claim
  # that staged mixing outperforms uniform mixing.
  schedule:
    - step_fraction: 0.0
      historical_context: 0.4
      temporal_transition: 0.3
      target_context: 0.3
    - step_fraction: 0.5
      historical_context: 0.25
      temporal_transition: 0.35
      target_context: 0.4
    - step_fraction: 1.0
      historical_context: 0.15
      temporal_transition: 0.25
      target_context: 0.6

path_qa:
  # Disabled for the current qa/qa_cot-only scope: promoted path answers
  # export as cross_document_qa/cross_document_qa_cot, outside that scope.
  enabled: true
  qa_cot_fraction: 0.5

source_windows:
  enabled: true
  max_chunks: 4
  max_input_tokens: 8192
  reserved_prompt_tokens: 3072
  conservative_chars_per_token: 2.5
  require_exact_prompt_tokens: false
  safety_margin_tokens: 256

