project:
  name: nrl-procurement-synthetic-data

# Environment variables in .env override these defaults.
curator:
  local_only: true
  viewer_enabled: false
  telemetry_enabled: false

paths:
  source_dir: data/source
  ocr_dir: data/interim/ocr
  output_dir: data/synthetic
  drafting_seeds: data/seeds/drafting_requests.jsonl

model_profiles:
  glm:
    served_model_env: GLM_MODEL
    base_url_env: GLM_BASE_URL
    api_key_env: GLM_API_KEY
    structured_output_mode: json_schema
  nemotron:
    served_model_env: NEMOTRON_MODEL
    base_url_env: NEMOTRON_BASE_URL
    api_key_env: NEMOTRON_API_KEY
    structured_output_mode: md_json
  gemma:
    served_model_env: GEMMA_MODEL
    base_url_env: GEMMA_BASE_URL
    api_key_env: GEMMA_API_KEY
    structured_output_mode: json_schema
  qwen:
    served_model_env: QWEN_MODEL
    base_url_env: QWEN_BASE_URL
    api_key_env: QWEN_API_KEY
    # Conservative fallback until this exact endpoint passes its probe.
    structured_output_mode: md_json

models:
  generation:
    mode: hosted_vllm
    profile_env: GENERATION_PROFILE
    default_profile: glm
    private_endpoint_only: true
    request_timeout: 1800
    max_concurrent_requests: 128
    # Explicit private-provider limits avoid Curator's public-provider fallback.
    max_requests_per_minute: 10000
    max_tokens_per_minute: 100000000
    generation_params:
      temperature: 1.0
      top_p: 0.95
      max_tokens: 4096
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  # Set JUDGE_* in .env to use a different local model. When omitted, generation
  # is reused so the pipeline remains runnable; production runs should separate them.
  judge:
    mode: hosted_vllm
    profile_env: JUDGE_PROFILE
    default_profile: nemotron
    private_endpoint_only: true
    request_timeout: 1800
    max_concurrent_requests: 64
    # Keep judge throttling independent when it uses a separate local endpoint.
    max_requests_per_minute: 10000
    max_tokens_per_minute: 100000000
    generation_params:
      temperature: 1.0
      top_p: 0.95
      max_tokens: 4096
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  ocr:
    engine: chandra
    model_env: OCR_MODEL
    base_url_env: OCR_BASE_URL
    api_key_env: OCR_API_KEY
    private_endpoint_only: true
    command_env: OCR_COMMAND
    output_dir_env: OCR_OUTPUT_DIR

quality:
  examples_per_chunk: 3
  minimum_judge_score: 4
  judge_batch_size: 8
  dedupe_threshold: 94
  allow_unjudged_exports: false

drafting:
  enabled: true

# Explicit relationships define which manuals may be combined. Lexical alignment
# only proposes passages within these pairs; it never establishes legal equivalence.
cross_document:
  enabled: true
  examples_per_bundle: 2
  minimum_similarity: 12
  minimum_shared_terms: 5
  max_bundles_per_pair: 25
  pairs:
    - pair_id: government_nrl_goods
      left_manual: goods_2022
      right_manual: nrl_goods_rev1
      relationship_type: government_company_comparison
    - pair_id: government_nrl_works
      left_manual: works_2022
      right_manual: nrl_works_rev1
      relationship_type: government_company_comparison
    - pair_id: government_nrl_services
      left_manual: services_2022
      right_manual: nrl_consultancy_other_services_rev1
      relationship_type: government_company_comparison
    - pair_id: government_goods_temporal
      left_manual: goods_2017
      right_manual: goods_2024
      relationship_type: same_authority_temporal
    - pair_id: government_works_temporal
      left_manual: works_2019
      right_manual: works_2025
      relationship_type: same_authority_temporal
    - pair_id: government_services_consultancy_temporal
      left_manual: services_2017
      right_manual: services_consultancy_2025
      relationship_type: same_authority_temporal
    - pair_id: nrl_goods_works
      left_manual: nrl_goods_rev1
      right_manual: nrl_works_rev1
      relationship_type: company_cross_domain
    - pair_id: nrl_goods_services
      left_manual: nrl_goods_rev1
      right_manual: nrl_consultancy_other_services_rev1
      relationship_type: company_cross_domain
    - pair_id: nrl_works_services
      left_manual: nrl_works_rev1
      right_manual: nrl_consultancy_other_services_rev1
      relationship_type: company_cross_domain

splits:
  train: 0.8
  validation: 0.1
  test: 0.1
  seed: nrl-procurement-v1
