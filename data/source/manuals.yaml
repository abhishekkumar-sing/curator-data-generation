# Source documents for corpus preprocessing (nrl_curator_native.preprocess).
#
# The corpus contains two deliberately distinguished source groups:
#
# 1. 16 Government of India documents under procurement_manuals/: full
#    editions across three eras plus amendment/corrigendum Office Memoranda.
# 2. 3 Numaligarh Refinery Limited Rev1 PDF manuals beside this file: NRL's
#    company manuals for Goods, Works, and Consultancy & Other Services.
#
# Every source is registered separately so generated records retain exact
# manual/page provenance. Government reference guidance and NRL company policy
# must not be presented as though they have the same issuing authority.
#
# procurement_manuals/ is a cleaner re-conversion of the same 16 editions
# that used to live under the now-removed "Manuals md output/" tree: one
# Markdown file per manual instead of combined.md plus per-page files, same
# source conversion tool and the same `<!-- Page N -->` marker convention --
# the Markdown extractor splits on these directly, so every chunk keeps a
# true, citable page number exactly like the original PDF path did.
#
# Dates use only the precision each document itself states (a full
# "DD.MM.YYYY" for OMs, which are dated letters; "Month YYYY" or "YYYY" for
# manual editions, which state a revision month/year on the cover but not
# a specific day).
#
# Official-source verification cutoff: 2026-07-30. The Department of
# Expenditure publication index verifies the registered Government edition
# identities below. Publication identity alone does not prove that no later OM
# modifies an individual provision. The NRL public website was checked at the
# same cutoff. The three NRL PDFs below are the locally registered authority
# documents and are pinned by SHA-256. No public procurement-manual index
# establishing post-Rev1 amendment/currentness lineage was located, so the
# documents are verified inputs but are not asserted "current".

manuals:
  # --- Goods ---
  - manual_id: goods_2017
    title: Manual for Procurement of Goods, 2017
    file: "procurement_manuals/goods_2017_full/Manual_for_Procurement_of_Goods_2017_FULL_MANUAL_ORIGINAL.md"
    release_date: "2017"
    revision_date: "2017"
    as_of_date: "2017"
    start_page: 1
    exclude_pages: []
    official_verification:
      status: archived_source_registered
      cutoff: "2026-07-30"
      authority_url: "https://doe.gov.in/manuals"

  - manual_id: goods_2022
